<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} — {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <header>
    <nav class="container">
      <a class="logo" href="{{ '/' | relative_url }}">
        {{ site.title }}
      </a>

      <div class="nav-links">
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <span>© {{ 'now' | date: "%Y" }} {{ site.title }}</span>
      <a href="{{ '/privacy' | relative_url }}">Privacy Policy</a>
    </div>
  </footer>

</body>
</html>
